# Blueprint cho Render.com: deploy dạng Static Site (Vite build ra thư mục dist).
# Render > New > Blueprint > chọn repo GitHub này, Render sẽ tự đọc file này.
services:
  - type: web
    runtime: static
    name: so-chi-tieu-6651071062
    # Không ghi branch: Render dùng nhánh mặc định của repo (main hay master đều được).
    # Nếu code nằm trong thư mục con của repo, bỏ dấu # ở dòng dưới và sửa tên thư mục:
    # rootDir: 6651071062_LAB2
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
    # SPA: mọi đường dẫn (vd. /item/abc khi bấm F5) đều trả về index.html để React Router xử lý.
    # Render không đọc vercel.json hay public/_redirects nên phải khai báo ở đây.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File trong /assets có hash trong tên nên cache lâu được.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html luôn lấy bản mới để thấy ngay bản deploy mới nhất.
      - path: /index.html
        name: Cache-Control
        value: no-cache
